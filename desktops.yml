---
- name: Tarefas comuns para desktops
  hosts: desktops
  roles:
    - role: ajholanda.googlechrome
      tags: googlechrome
    - libreoffice
    - netbios
    - role: remotedesktop
      when: "'ti' not in group_names"
    - update
    - user
    - sshserver

- name: Desktops de desenvolvedores
  hosts: devs
  roles:
    - role: ajholanda.vscode
      tags: vscode
    - devtools

- name: Desktops da TI
  hosts: ti
  roles:
    - role: ajholanda.x2goclient
      tags: x2goclient

# Obs.: As tarefas executadas no grupo lab provocarão
# alterações de estado (changed) somente no lab01.example.net.
# Para não criar muitas máquinas virtuais, todos os hosts
# do grupo lab apontam para a mesma máquina virtual.
- name: Laboratório de informática
  hosts: lab
  roles:
    - power
    - sssd
