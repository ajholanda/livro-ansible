---
- name: Garante que a imagem Docker com o PostgreSQL esteja presente
  community.docker.docker_image:
    name: "postgres:{{ docker_postgres_version }}"
    source: pull
  tags: docker_postgres

- name: Cria o diretório raiz do PostgreSQL
  ansible.builtin.file:
    path: "{{ docker_postgres_volume | mandatory }}"
    state: directory
    owner: root
    group: root
    mode: '0775'
  tags: docker_postgres

- name: Garante a execução do contêiner Docker com o PostgreSQL
  community.docker.docker_container:
    name: "postgres"
    image: "postgres:{{ docker_postgres_version }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: app_network
    ports:
      - "{{ docker_postgres_port | default(5432) }}:5432"
    volumes:
      - "{{ docker_postgres_volume }}:/var/lib/postgresql"
    env:
      POSTGRES_USER: "{{ docker_postgres_user | default('postgres') }}"
      POSTGRES_PASSWORD: "{{ docker_postgres_password | mandatory }}"
      POSTGRES_DB: "{{ docker_postgres_db | default('postgres') }}"
      POSTGRES_INITDB_ARGS: "{{ docker_postgres_initdb_args | default('') }}"
  tags: docker_postgres

- name: Aguarda o PostgreSQL ficar disponível
  community.docker.docker_container_exec:
    container: postgres
    command: >
      pg_isready
      -U {{ docker_postgres_user | default('postgres') }}
      -d {{ docker_postgres_db | default('postgres') }}
  register: postgres_ready
  until: postgres_ready.rc == 0
  retries: 10
  delay: 3
  changed_when: false
  tags: docker_postgres
