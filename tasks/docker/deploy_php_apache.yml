---
- name: Garante que a imagem com o PHP e Apache esteja presente
  community.docker.docker_image:
    name: "php:{{ docker_php_version }}-apache"
    source: pull
  tags: docker_php_apache

- name: Garante que o diretório de armazenamento de dados exista
  ansible.builtin.file:
    path: "{{ docker_php_apache_volume | mandatory }}"
    state: directory
    owner: root
    group: root
    mode: '0775'
  tags: docker_php_apache

- name: Garante que o contêiner PHP esteja em execução
  community.docker.docker_container:
    name: "php_apache"
    image: "php:{{ docker_php_version }}-apache"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: app_network
    ports:
      - "{{ docker_php_apache_port | mandatory }}:80"
    volumes:
      - "{{ docker_php_apache_volume | mandatory }}:/var/www/html"
  tags: docker_php_apache

- name: Cria uma página inicial para teste
  ansible.builtin.copy:
    content: |
      <?php
      phpinfo();
    dest: "{{ docker_php_apache_volume }}/index.php"
    mode: '0644'
  tags: docker_php_apache

- name: Aguarda o servidor web responder
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ docker_php_apache_port }}/"
    status_code: 200
  register: php_http
  until: php_http.status == 200
  retries: 10
  delay: 3
  tags: docker_php_apache
