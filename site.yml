---
- name: Identifica o ambiente de execução do Ansible
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  tasks:
    - name: Exibe o nome do sistema e a distribuição Linux
      ansible.builtin.debug:
        msg: >-
          Sistema: {{ ansible_facts['hostname'] }};
          distribuição: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}.