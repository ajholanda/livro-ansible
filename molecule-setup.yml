---
- name: Instala o Ansible Molecule e o plugin Docker
  hosts: localhost
  become: true

  roles:
    - docker

  tasks:
    - name: Instala as dependências para a família Debian
      ansible.builtin.apt:
        name:
          - python3-pip
          - libssl-dev
      when: ansible_facts['os_family'] == 'Debian'

    - name: Instala o pacote virtualenv
      ansible.builtin.package:
        name: virtualenv
        state: present

    - name: Instala as ferramentas de teste em um ambiente virtual
      become: false
      ansible.builtin.pip:
        virtualenv: ~/ansible-venv
        name:
          - "ansible-core=={{ ansible_core_version }}"
          - "molecule=={{ molecule_version }}"
          - "molecule-plugins[docker]=={{ molecule_plugins_version }}"
          - "pytest-testinfra=={{ testinfra_version }}"
      notify: Logout warning

  handlers:
    - name: Logout warning  # REPO-ONLY
      ansible.builtin.debug:
        msg: "Talvez você tenha que fazer logout e login para usar o Molecule"

##
# A estrutura dos arquivos gerados por molecule init scenario pode variar
# conforme as versões do Molecule e dos plugins instalados.
# Para facilitar a reprodução dos exemplos do Capítulo 11,
# registramos as versões utilizadas do molecule, do molecule-plugins,
# do ansible-core e do pytest-testinfra.
##
