---
- name: Gerenciamento de aplicação web
  hosts: web.example.net

  tasks:
    - name: Instala o Redis
      ansible.builtin.package:
        name: redis
        state: present

    - name: Atualiza a configuração da aplicação web
      ansible.builtin.template:
        src: files/webapp.conf
        dest: /etc/webapp.conf
        owner: root
        group: root
        mode: "0644"
      notify: "restart webapp services"

  handlers:
    - name: Restart redis
      ansible.builtin.service:
        name: redis
        state: restarted
      listen: "restart webapp services"

    - name: Restart apache2
      ansible.builtin.service:
        name: apache2
        state: restarted
      listen: "restart webapp services"      
