---
- name: Administra servidores web
  hosts: webservers

  tasks:
    - name: Instala o Apache
      ansible.builtin.package:
        name: apache2
        state: present
      tags: webservers, webservers_package

    - name: Habilita e inicia o Apache
      ansible.builtin.service:
        name: apache2
        enabled: true
        state: started
      tags:
        - webservers
        - webservers_service

    - name: Copia o arquivo de configuração
      ansible.builtin.copy:
        src: files/site.conf
        dest: /etc/apache2/sites-available/site.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart apache2
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - webservers
        - webservers_copy

    - name: Ativa site no Apache2 via link simbólico
      ansible.builtin.file:
        src: /etc/apache2/sites-available/site.conf
        dest: /etc/apache2/sites-enabled/site.conf
        state: link
      notify: Restart apache2
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - webservers
        - webservers_enable

  handlers:
    - name: Restart apache2
      ansible.builtin.service:
        name: apache2
        state: restarted
