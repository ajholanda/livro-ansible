---
# Precisamos do role package para adicionar o
# repositório de pacotes extras EPEL para
# as distribuições derivadas da Red Hat.
- name: Inclui o role package
  ansible.builtin.include_role:
    name: package
  tags: fail2ban

- name: Instala o Fail2Ban
  ansible.builtin.package:
    name: fail2ban
  tags: fail2ban

- name: Habilita e inicia o serviço
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  tags: fail2ban

- name: Configura o jail sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      [sshd]
      enabled = true
      maxretry = 6
      findtime = 350
      bantime = 600
  notify: Restart fail2ban
  tags: fail2ban
