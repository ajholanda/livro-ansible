---
- name: Instala o X2Go Server
  ansible.builtin.package:
    name: x2goserver
    state: present
  tags: remotedesktop

- name: Habilita e inicia o x2goserver
  ansible.builtin.service:
    name: "{{ remotedesktop_service[ansible_facts['os_family']] }}"
    enabled: true
    state: started
  tags: remotedesktop
