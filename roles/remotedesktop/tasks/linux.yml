---
- name: Instala o X2Go Server
  ansible.builtin.package:
    name: x2goserver
    state: present
  tags: remotedesktop

- name: Habilita e inicia o x2goserver
  ansible.builtin.service:
    name: "{{ 'x2gocleansessions' if ansible_os_family == 'RedHat' else 'x2goserver' }}"
    enabled: true
    state: started
  tags: remotedesktop
