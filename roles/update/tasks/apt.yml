---
- name: Instala o pacote unattended-upgrades
  ansible.builtin.package:
    name: unattended-upgrades
    state: present
  tags: update

- name: Habilita e inicia o serviço unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  tags: update

- name: Ativa as atualizações automáticas diárias  # REPO-ONLY
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'
  tags: update

- name: Personaliza as regras de atualização  # REPO-ONLY
  ansible.builtin.blockinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    insertafter: EOF
    marker: "// {mark} ANSIBLE MANAGED BLOCK update.apt.custom_rules"
    block: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "02:00";
  tags: update

- name: Configura notificações por email
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^(//\s*)?Unattended-Upgrade::Mail\s+.*;'
    line: 'Unattended-Upgrade::Mail "ajh@example.net";'
    backup: true
  when: update_send_notifications
  tags: update

- name: Desabilita notificações por email  # REPO-ONLY
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^Unattended-Upgrade::Mail\s+.*;'
    state: absent
    backup: true
  when: not update_send_notifications
  tags: update

- name: Testa a configuração com um dry-run  # REPO-ONLY
  ansible.builtin.command: unattended-upgrade --dry-run --debug
  register: dry_run_output
  changed_when: false
  tags: update

- name: Exibe o resultado do teste  # REPO-ONLY
  ansible.builtin.debug:
    var: dry_run_output.stdout_lines
  tags: update
