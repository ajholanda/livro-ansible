---
- name: Instala o programa rsync
  ansible.builtin.package:
    name: rsync
  tags: rsyncserver

- name: Copia arquivo com usuários e senhas
  ansible.builtin.copy:
    src: rsyncd.secrets
    dest: /etc/
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  tags: rsyncserver
