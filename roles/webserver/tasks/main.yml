---
- name: Carrega variáveis da família do sistema operacional
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/{{ ansible_facts['os_family'] | lower }}.yml"
      # O atribuição a seguir funciona com o ansible-playbook, mas gera problemas
      # com o CI/CD do Github.
      # file: "{{ ansible_facts['os_family'] | lower }}.yml"
  tags: webserver

- name: Instala o Apache
  ansible.builtin.package:
    name: "{{ webserver_package }}"
    state: present
  tags: webserver

- name: Habilita e inicia o Apache
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    enabled: true
    state: started
  tags: webserver

- name: Copia a página teste
  ansible.builtin.copy:
    src: index.html
    dest: "{{ webserver_document_root }}/index.html"
    owner: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    mode: "0644"
  tags: webserver

- name: Copia o arquivo de configuração
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ webserver_confdir | mandatory }}/site.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart apache
  tags: webserver

- name: Ativa o site padrão via link simbólico (família Debian)
  ansible.builtin.file:
    src: "{{ webserver_confdir | mandatory }}/site.conf"
    dest: "/etc/apache2/sites-enabled/site.conf"
    state: link
  notify: Restart apache
  when: ansible_facts['os_family'] == 'Debian'
  tags: webserver

- name: Configura a porta de escuta  # REPO-ONLY
  ansible.builtin.lineinfile:
    path: "{{ webserver_ports_conf }}"
    regexp: '^Listen '
    line: 'Listen {{ webserver_http_port }}'
  notify: Restart apache
  tags: webserver

- name: Libera a porta HTTP no firewalld (família RedHat)  # REPO-ONLY
  ansible.posix.firewalld:
    port: "{{ webserver_http_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_os_family == 'RedHat'
