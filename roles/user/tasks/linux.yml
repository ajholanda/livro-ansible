---
- name: Cria os usuários administradores
  ansible.builtin.user:
    name: "{{ u_item.name }}"
    password: "{{ u_item.passwd }}"
    shell: /bin/bash
    groups: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
    append: true
  loop: "{{ user_admins | default([]) }}"
  loop_control:
    loop_var: u_item
    label: "{{ u_item.name }}"
  tags: user

- name: Copia a chave pública
  ansible.posix.authorized_key:
    user: "{{ u_item.name }}"
    state: present
    key: "{{ lookup('file', 'files/%s.pub' | format(u_item.name)) }}"
  loop: "{{ user_admins | default([]) }}"
  loop_control:
    loop_var: u_item
    label: "{{ u_item.name }}"
  tags: user

- name: Elimina a solicitação de senha pelo sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ u_item.name }}"
    content: "{{ u_item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: 'visudo -cf %s'
    owner: root
    group: root
    mode: "0440"
  loop: "{{ user_admins }}"
  loop_control:
    loop_var: u_item
    label: "{{ u_item.name }}"
  tags: user
