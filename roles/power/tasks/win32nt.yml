---
- name: Agenda desligamento automático diário
  community.windows.win_scheduled_task:
    name: "LabShutdown"
    description: "Desligamento automático"
    actions:
      - path: shutdown.exe
        arguments: "/s /f /t 60"
    triggers:
      - type: daily
        start_boundary: >-
          2026-01-28T{{ '%02d' | format(power_shutdown_hour | int) }}:{{ '%02d' | format(power_shutdown_minute | int) }}:00
    username: SYSTEM
    run_level: highest
  tags: power

- name: Define o plano de energia como equilibrado
  community.windows.win_power_plan:
    name: Balanced
  tags: power

- name: Configura o tempo limite de suspensão no Windows
  ansible.windows.win_command: >
    powercfg /change standby-timeout-ac {{ ( power_suspend_timeout | int ) // 60 }}
  tags: power

- name: Desativar hibernação
  ansible.windows.win_command: >
    powercfg /hibernate off
  tags: power

- name: Obtém informações sobre a tarefa de desligamento  # REPO-ONLY
  community.windows.win_scheduled_task_stat:
    name: LabShutdown
  register: lab_shutdown_task
  tags: power

- name: Verifica se a tarefa de desligamento foi criada  # REPO-ONLY
  ansible.builtin.assert:
    that:
      - lab_shutdown_task.task_exists
    fail_msg: A tarefa agendada LabShutdown não foi criada.
    success_msg: A tarefa agendada LabShutdown foi criada com sucesso.
  tags: power
