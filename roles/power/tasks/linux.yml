---
- name: Copia o arquivo de serviço do desligamento (systemd)
  ansible.builtin.copy:
    dest: /etc/systemd/system/lab-shutdown.service
    content: |
      [Unit]
      Description=Desligamento automático

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/shutdown -h now
    owner: root
    group: root
    mode: '0640'
  # BEGIN REPO-ONLY
  notify: Restart lab-shutdown timer
  # END REPO-ONLY
  tags: power

- name: Copia o arquivo de temporização do desligamento (systemd)
  ansible.builtin.template:
    src: lab-shutdown.timer.j2
    dest: /etc/systemd/system/lab-shutdown.timer
    owner: root
    group: root
    mode: '0640'
  # BEGIN REPO-ONLY
  notify: Restart lab-shutdown timer
  # END REPO-ONLY
  tags: power

- name: Habilita e inicia o timer de desligamento
  ansible.builtin.systemd_service:
    name: lab-shutdown.timer
    daemon_reload: true
    enabled: true
    state: started
  tags: power

#
# Suspensão automática
#
- name: Garante a existência do diretório /etc/systemd/logind.conf.d/  # REPO-ONLY
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: power

- name: Configura suspensão automática pelo systemd-logind
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-power.conf
    content: |
      [Login]
      IdleAction=suspend
      IdleActionSec={{ power_suspend_timeout }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-logind
  tags: power
