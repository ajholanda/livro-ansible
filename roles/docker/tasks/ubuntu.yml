---
- name: Desinstala os pacotes não oficiais
  ansible.builtin.apt:
    pkg:
      - docker.io
      - docker-compose
      - docker-doc
      - podman-docker
    state: absent
  tags: docker

- name: Instala dependências
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
      - software-properties-common
  tags: docker

- name: Adiciona o repositório Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: docker

- name: Instala os pacotes oficiais
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  tags: docker

- name: Cria o grupo docker
  ansible.builtin.group:
    name: docker
  tags: docker

- name: Adiciona usuários no grupo docker
  ansible.builtin.user:
    name: "{{ d_user }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  loop_control:
    loop_var: d_user
  when: docker_users is defined
  tags: docker

- name: Habilita e inicia o serviço docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  tags: docker
