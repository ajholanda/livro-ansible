---
- name: Instala o banco de dados MariaDB e o driver Python PyMySQL  # REPO-ONLY
  ansible.builtin.package:
    pkg:
      - mariadb-client
      - mariadb-common
      - mariadb-server
      - python3-pymysql
  tags: mariadb

- name: Adiciona usuário com privilégios administrativos
  community.mysql.mysql_user:
    name: "{{ mariadb_user }}"
    password: "{{ mariadb_password }}"
    priv: '*.*:ALL'
  tags: mariadb
