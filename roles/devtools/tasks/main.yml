---
- name: Carrega variáveis da família do sistema operacional
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/{{ ansible_facts['os_family'] | lower }}.yml"
  tags: devtools

- name: Instala os pacotes de desenvolvimento
  ansible.builtin.package:
    name: "{{ devtools_packages | map('extract', devtools_packages_map) | flatten | list }}"
    state: present
  # BEGIN REPO-ONLY
  when: >-
    ansible_facts['os_family'] == 'Debian'
    or ansible_facts['os_family'] == 'RedHat'
  # END REPO-ONLY
  tags: devtools

# BEGIN REPO-ONLY
- name: Instala os pacotes de desenvolvimento (Windows)
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ devtools_packages | map('extract', devtools_packages_map) | flatten | list }}"
    state: present
  when: ansible_facts['os_family'] == 'Windows'
  tags: devtools
# END REPO-ONLY
