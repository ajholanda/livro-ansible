---
- name: Cria um lspci que simula a existência de GPU
  ansible.builtin.copy:
    dest: /usr/local/bin/lspci
    mode: "0755"
    content: |
      #!/bin/sh
      echo "01:00.0 VGA compatible controller: NVIDIA Corporation GA106 [GeForce RTX 3060]"
  when: ansible_facts['distribution'] == "Ubuntu"
  tags: nvidia

- name: Verifica a existência da placa NVIDIA
  ansible.builtin.command: lspci
  register: nvidia_lspci
  changed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"
  tags: nvidia

- name: Instala os drivers e bibliotecas
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - "'nvidia' in nvidia_lspci.stdout | lower"
  tags: nvidia
  block:
    - name: Instala o pacote de gerenciamento de drivers
      ansible.builtin.package:
        name: ubuntu-drivers-common
        state: present

    - name: Verifica se o driver NVIDIA já está instalado
      ansible.builtin.command: nvidia-smi
      register: nvidia_check
      failed_when: false
      changed_when: false

    - name: Instala o driver NVIDIA
      ansible.builtin.command: ubuntu-drivers autoinstall
      when: nvidia_check.rc != 0

    - name: Instala ferramentas NVIDIA e o toolkit CUDA
      ansible.builtin.package:
        name:
          - nvidia-cuda-toolkit
          - nvidia-settings
          - nvtop
        state: present
