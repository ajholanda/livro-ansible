---
- name: Carrega roles comuns para servidores
  hosts: servers
  roles:
    - fail2ban
    - update
    - user
    - sshserver

- name: Administra servidores de banco de dados
  hosts: dbservers
  tags: mariadb  # REPO-ONLY
  roles:
    - mariadb

- name: Administra servidores rsync
  hosts: rsyncservers
  tags: rsyncserver  # REPO-ONLY
  roles:
    - rsyncserver

- name: Administra servidores web
  hosts: webservers
  tags: webserver  # REPO-ONLY
  roles:
    - webserver
